name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Noetic image
        run: docker build -f baxter_simulator/Dockerfile -t baxter-noetic:ci .

      - name: Run smoke checks
        run: |
          docker run --rm baxter-noetic:ci bash -lc '
            source /root/baxter_ws/install/setup.bash
            cd /root/baxter_ws/src/baxter_noetic
            python3 test/test_smoke.py
          '

      - name: Run kinematics checks
        run: |
          docker run --rm baxter-noetic:ci bash -lc '
            source /root/baxter_ws/devel/setup.bash
            cd /root/baxter_ws/build/baxter_sim_kinematics
            make test_kinematics
            roscore >/tmp/roscore.log 2>&1 &
            roscore_pid=$!
            trap "kill $roscore_pid || true" EXIT
            sleep 5
            timeout 120 /root/baxter_ws/devel/.private/baxter_sim_kinematics/lib/baxter_sim_kinematics/test_kinematics
          '

      - name: Parse launch files
        run: |
          docker run --rm baxter-noetic:ci bash -lc '
            source /root/baxter_ws/install/setup.bash
            roslaunch --nodes baxter_gazebo baxter_world.launch
            roslaunch --nodes baxter_moveit_config planning_context.launch load_robot_description:=true
            roslaunch --nodes baxter_moveit_config move_group.launch
          '
